    <rect x="113" y="146" width="78" height="220" rx="39"/>
    <rect x="217" y="146" width="78" height="220" rx="39"/>
    <rect x="321" y="146" width="78" height="220" rx="39"/>
  </g>
  <rect x="131" y="198" width="42" height="150" rx="21" fill="#a6dcbd"/>
  <rect x="235" y="278" width="42" height="70" rx="21" fill="#e9c46a"/>
  <rect x="339" y="232" width="42" height="116" rx="21" fill="#f6f5f1"/>
