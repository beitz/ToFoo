name: Test and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the deploy back for hours (default limit 6 h).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the app's version number counts commits (scripts/app-version.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # End-to-end tests of the main flows against the build (e2e/, playwright.config.ts).
      # Browser only: the runner image already has the libraries Chromium needs, and --with-deps went
      # through apt, whose mirror stalled for 10+ minutes twice on 2026-10-23 and held deploys back.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Two merges close together used to fail the second deploy ("in progress deployment", PR #132
    # never went live). Deploys now wait their turn; a newer waiting one replaces an older waiting one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
